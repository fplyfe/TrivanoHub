# TrivanoHub para o Docker Manager da Hostinger: apague tudo no Editor YAML e cole este arquivo.
# Usa as imagens prontas do ghcr.io (publicadas pelo GitHub Actions) e o Traefik da Hostinger.
# Troque: SENHA_DO_BANCO (4 lugares, só letras e números), CHAVE_SECRETA_32_OU_MAIS,
# nome/e-mail/SENHA_INICIAL_ADMIN do administrador e o domínio em Host(`...`).
# Deixe a aba "Ambiente" vazia: tudo está aqui.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: trivano
      POSTGRES_DB: trivano
      POSTGRES_PASSWORD: SENHA_DO_BANCO
      TZ: America/Sao_Paulo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trivano -d trivano"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    image: ghcr.io/fplyfe/trivanohub-migrator:latest
    pull_policy: always
    restart: "no"
    environment:
      DATABASE_URL: postgresql://trivano:SENHA_DO_BANCO@db:5432/trivano?schema=public
      USER1_NAME: Nome do Administrador
      USER1_EMAIL: admin@seudominio.com.br
      USER1_PASSWORD: SENHA_INICIAL_ADMIN
    depends_on:
      db:
        condition: service_healthy

  app:
    image: ghcr.io/fplyfe/trivanohub:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://trivano:SENHA_DO_BANCO@db:5432/trivano?schema=public
      AUTH_SECRET: CHAVE_SECRETA_32_OU_MAIS
      COOKIE_SECURE: "true"
      APP_TZ: America/Sao_Paulo
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:3090:3000"
    networks:
      - default
      - traefik-proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-proxy
      - traefik.http.routers.trivanohub.rule=Host(`hub.seudominio.com.br`)
      - traefik.http.routers.trivanohub.entrypoints=websecure
      - traefik.http.routers.trivanohub.tls=true
      - traefik.http.routers.trivanohub.tls.certresolver=letsencrypt
      - traefik.http.services.trivanohub.loadbalancer.server.port=3000
    depends_on:
      migrate:
        condition: service_completed_successfully

  backup:
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: trivano
      POSTGRES_DB: trivano
      POSTGRES_PASSWORD: SENHA_DO_BANCO
      POSTGRES_EXTRA_OPTS: "--clean --if-exists"
      SCHEDULE: "0 0 3 * * *"
      BACKUP_KEEP_DAYS: "7"
      BACKUP_KEEP_WEEKS: "4"
      BACKUP_KEEP_MONTHS: "6"
      TZ: America/Sao_Paulo
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:

networks:
  traefik-proxy:
    external: true
