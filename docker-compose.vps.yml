# Complemento para rodar na VPS, com HTTPS:
#   docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d --build
# O app continua preso em 127.0.0.1 (só o próprio servidor enxerga); o acesso de fora passa pelo Caddy.
services:
  app:
    environment:
      COOKIE_SECURE: "true"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
